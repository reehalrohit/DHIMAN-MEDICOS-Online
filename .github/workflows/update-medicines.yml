name: Update Medicine Catalog

on:
  push:
    paths:
      - "invoices/**"
  workflow_dispatch:

concurrency:
  group: update-medicines-main
  cancel-in-progress: false

jobs:
  update-catalog:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync with main
        run: |
          git config user.name "Dhiman Medicos Bot"
          git config user.email "reehalrohit@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main

      - name: Check for CSV files
        id: check
        run: |
          COUNT=$(find invoices -type f \( -name "*.csv" -o -name "*.CSV" \) 2>/dev/null | wc -l)
          echo "csv_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Found $COUNT CSV file(s)"

      - name: Verify Supabase secrets
        if: steps.check.outputs.csv_count != '0'
        run: |
          test -n "$SUPABASE_URL" || { echo "❌ SUPABASE_URL secret is missing"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "❌ SUPABASE_SERVICE_ROLE_KEY secret is missing"; exit 1; }
          echo "✓ Supabase secrets are configured"

      - name: Process invoice CSVs
        if: steps.check.outputs.csv_count != '0'
        run: python3 .github/scripts/process-invoice.py

      - name: Cleanup duplicates
        if: steps.check.outputs.csv_count != '0'
        run: python3 .github/scripts/cleanup_duplicates.py

      - name: Validate catalog
        if: steps.check.outputs.csv_count != '0'
        run: python3 .github/scripts/validate_catalog.py

      - name: Verify JS syntax
        if: steps.check.outputs.csv_count != '0'
        run: node --check lib/medicines.js

      - name: Remove generated duplicate report
        if: steps.check.outputs.csv_count != '0'
        run: rm -f duplicates-report.txt

      - name: Confirm main did not change during processing
        if: steps.check.outputs.csv_count != '0'
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "❌ main changed while the invoice was being processed."
            echo "Re-run the workflow; processing is idempotent."
            exit 1
          fi
          echo "✓ main is unchanged; safe to commit"

      - name: Commit updated catalog and invoice history
        if: steps.check.outputs.csv_count != '0'
        run: |
          git add lib/medicines.js
          git add .github/processed-invoices.json 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "✓ Nothing to commit."
            exit 0
          fi

          ADDED=$(git diff --staged lib/medicines.js | grep '^+.*name:' | wc -l || true)
          git commit -m "Auto-update catalog and inventory from invoice (+${ADDED} medicines)"

          # Keep the origin configured by actions/checkout.
          # This avoids pushing to a hard-coded/wrong repository URL.
          git push origin HEAD:main
