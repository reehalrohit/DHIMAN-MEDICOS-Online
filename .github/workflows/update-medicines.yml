name: Update Medicine Catalog

on:
  push:
    paths:
      - "invoices/**"
      - ".github/scripts/process-invoice.py"
      - "supabase/migrations/**"
  workflow_dispatch:

# Never run two invoice imports against Supabase/main at the same time.
concurrency:
  group: update-medicine-catalog
  cancel-in-progress: false

jobs:
  update-catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      contents: write

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Check for CSV files
        id: check
        run: |
          COUNT=$(find invoices -type f \( -name "*.csv" -o -name "*.CSV" \) 2>/dev/null | wc -l)
          echo "csv_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Found $COUNT CSV file(s)"

      - name: Verify Supabase secrets
        if: steps.check.outputs.csv_count != '0'
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "❌ SUPABASE_URL secret is missing"
            exit 1
          fi

          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "❌ SUPABASE_SERVICE_ROLE_KEY secret is missing"
            exit 1
          fi

          echo "✓ Supabase secrets are configured"

      - name: Process invoice CSVs
        if: steps.check.outputs.csv_count != '0'
        run: python3 .github/scripts/process-invoice.py

      - name: Cleanup duplicates
        if: steps.check.outputs.csv_count != '0'
        run: python3 .github/scripts/cleanup_duplicates.py

      - name: Validate catalog
        if: steps.check.outputs.csv_count != '0'
        run: python3 .github/scripts/validate_catalog.py

      - name: Verify JS syntax
        if: steps.check.outputs.csv_count != '0'
        run: node --check lib/medicines.js

      - name: Verify workflow script syntax
        if: steps.check.outputs.csv_count != '0'
        run: python3 -m py_compile .github/scripts/process-invoice.py

      - name: Commit updated catalog and invoice history
        if: steps.check.outputs.csv_count != '0'
        run: |
          git config user.name "Dhiman Medicos Bot"
          git config user.email "reehalrohit@users.noreply.github.com"

          # Generated duplicate reports must never be included in the commit.
          rm -f duplicates-report.txt

          git add lib/medicines.js
          git add .github/processed-invoices.json 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "✓ Nothing to commit."
          else
            ADDED=$(git diff --staged lib/medicines.js | grep '^+.*name:' | wc -l || true)

            git commit -m "Auto-update catalog and inventory from invoice (+${ADDED} medicines)"

            # Rebase generated changes onto any newer main commit before push.
            git fetch origin main
            git rebase origin/main

            # checkout@v5 already configured authenticated Git credentials.
            git push origin HEAD:main
          fi
