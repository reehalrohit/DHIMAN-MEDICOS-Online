name: Sync Manufacturer Product Metadata

on:
  workflow_dispatch:
  schedule:
    - cron: "47 2 * * 1"

concurrency:
  group: manufacturer-metadata-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: python3 -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Sync official manufacturer metadata
        run: python3 .github/scripts/sync-manufacturer-metadata.py
      - name: Upload unmatched reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manufacturer-metadata-unmatched
          path: |
            univentis-manufacturer-unmatched.json
            cipla-manufacturer-unmatched.json
          if-no-files-found: ignore
