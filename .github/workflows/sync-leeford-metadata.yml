name: Sync Leeford Product Metadata

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"

concurrency:
  group: leeford-metadata-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: python3 -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Sync Leeford metadata
        run: python3 .github/scripts/sync-leeford-metadata.py
      - name: Upload unmatched report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leeford-unmatched
          path: leeford-unmatched.json
          if-no-files-found: ignore
